<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Dog Sim</title>
<meta name="description" content="A physics-simulated robot dog you can talk to: sit, jump, backflip, somersault, roll over, play dead, and chat.">
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --surface-2: #eeece6; --text: #1d1d1b; --muted: #615f58; --line: #d9d6cc;
    --accent: #e8590c; --accent-ink: #ffffff; --blue: #1c6dd0; --green: #2b8a3e; --red: #c92a2a;
    --scene-bg: #e9e6df; --scene-floor: #f6f4ee; --scene-grid: #a39e92;
    --bubble: #ffffff; --you: #e7f0fc; --pet: #fdeee4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15161a; --surface: #1e2026; --surface-2: #272a31; --text: #ecebe6; --muted: #a3a29b; --line: #363942;
      --accent: #ff8a3d; --accent-ink: #1a1208; --blue: #6aa8ff; --green: #69c47a; --red: #ff8787;
      --scene-bg: #1a1c22; --scene-floor: #24272e; --scene-grid: #555b67;
      --bubble: #2b2e36; --you: #1f2c40; --pet: #3a2518;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  a { color: var(--blue); }
  header { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 52px; border-bottom: 1px solid var(--line); flex: none; }
  header h1 { font-size: 1.05rem; margin: 0; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header a { font-size: 0.9em; color: var(--muted); text-decoration: none; white-space: nowrap; }
  header a:hover { color: var(--text); }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 390px; }
  @media (max-width: 860px) {
    body { height: auto; display: block; }
    main { display: block; }
    .stage { height: 56vh; min-height: 320px; }
  }
  .stage { position: relative; min-height: 0; overflow: hidden; background: var(--scene-bg); }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  .overlay { position: absolute; pointer-events: none; font-size: 0.82rem; color: var(--muted); }
  #live { top: 12px; left: 12px; background: color-mix(in srgb, var(--surface) 82%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
  #live b { color: var(--text); }
  .hint { bottom: 10px; left: 12px; }
  #bubble { position: absolute; max-width: min(300px, 70%); background: var(--bubble); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; font-size: 0.92rem; box-shadow: 0 4px 18px rgb(0 0 0 / 0.12); transform: translate(-50%, calc(-100% - 14px)); pointer-events: none; opacity: 0; transition: opacity .2s; }
  #bubble.show { opacity: 1; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: var(--bubble); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
  #nogl { display: none; position: absolute; inset: 0; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

  .panel { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 860px) { .panel { border-left: none; border-top: 1px solid var(--line); } }
  .chat { flex: 1; min-height: 160px; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 860px) { .chat { max-height: 40vh; } }
  .msg { max-width: 88%; padding: 7px 12px; border-radius: 14px; font-size: 0.93rem; }
  .msg.you { align-self: flex-end; background: var(--you); border-bottom-right-radius: 4px; }
  .msg.pet { align-self: flex-start; background: var(--pet); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--muted); font-size: 0.8rem; text-align: center; }
  form.say { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
  form.say input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  button { font: inherit; font-size: 0.88rem; cursor: pointer; border-radius: 999px; padding: 7px 13px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  #mic.listening { background: var(--red); border-color: var(--red); color: #fff; }
  .section { padding: 12px 16px; border-top: 1px solid var(--line); }
  .section h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { padding: 5px 11px; font-size: 0.84rem; }
  dl.physics { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 14px; margin: 0; font-size: 0.86rem; }
  dl.physics dt { color: var(--muted); }
  dl.physics dd { margin: 0; font-variant-numeric: tabular-nums; }
  .ok { color: var(--green); font-weight: 600; }
  .bad { color: var(--red); font-weight: 600; }
  .small { font-size: 0.8rem; color: var(--muted); margin: 6px 0 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
</style>
</head>
<body>
<header>
  <h1>🐕 <span id="petName">Bolt</span>, the robot dog sim</h1>
  <a href="ROADMAP.md">Roadmap</a>
  <a href="../index.html">Robot guide</a>
</header>
<main>
  <div class="stage">
    <canvas id="scene" aria-label="3D view of the robot dog. Drag to orbit, scroll or pinch to zoom."></canvas>
    <div id="live" class="overlay" aria-hidden="true"></div>
    <div class="overlay hint">Drag to look around · scroll to zoom · double-click to reset</div>
    <div id="bubble" aria-hidden="true"></div>
    <div id="nogl">The 3D view couldn't start (your browser needs WebGL).<br>You can still chat with the dog on the right.</div>
  </div>

  <aside class="panel">
    <div class="chat" id="chat" aria-live="polite"></div>
    <form class="say" id="sayForm">
      <input id="sayInput" type="text" autocomplete="off" placeholder='Try "sit then do a backflip"' aria-label="Say something to the dog">
      <button type="button" id="mic" title="Talk with your voice" aria-label="Talk with your voice">🎤</button>
      <button class="primary" type="submit">Say</button>
    </form>
    <div class="section">
      <h2>Tricks</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="section">
      <h2>Physics of the last jump</h2>
      <dl class="physics" id="physics"><dt>No jumps yet</dt><dd>Try "backflip"</dd></dl>
    </div>
    <div class="section">
      <h2>Settings &amp; memory</h2>
      <div class="row">
        <button id="slowmo" aria-pressed="false">🐢 Slow motion</button>
        <button id="traceBtn" aria-pressed="true">Flight path</button>
        <button id="voiceBtn" aria-pressed="true">🔊 Voice</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="exportBtn">⬇ Export training data</button>
        <button id="forgetBtn">Forget everything</button>
      </div>
      <p class="small" id="memStat"></p>
    </div>
  </aside>
</main>

<script src="vendor/three.min.js"></script>
<script src="js/physics.js"></script>
<script src="js/dog.js"></script>
<script src="js/brain.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
